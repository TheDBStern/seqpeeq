name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    name: create the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: the tag must match the version, and the changelog must have it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found && !/^\[[^]]*\]: /
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          cat notes.md
      - name: create
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "seqpeeq $TAG" --notes-file notes.md --verify-tag

  build:
    name: ${{ matrix.target }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked -p seqpeeq --target ${{ matrix.target }}
      - name: the Linux program must be static
        if: contains(matrix.target, 'linux')
        run: |
          file target/${{ matrix.target }}/release/seqpeeq
          file target/${{ matrix.target }}/release/seqpeeq | grep -Eq 'statically linked|static-pie'
      - name: pack
        run: |
          name="seqpeeq-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/seqpeeq" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          mkdir "$name/docs"
          cp -R docs/keys.md docs/commands.md docs/screens "$name/docs/"
          cp -Rp examples "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: upload
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
