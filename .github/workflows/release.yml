name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked -p seqpeeq --target ${{ matrix.target }}
      - name: the Linux program must be static
        if: contains(matrix.target, 'linux')
        run: |
          file target/${{ matrix.target }}/release/seqpeeq
          file target/${{ matrix.target }}/release/seqpeeq | grep -Eq 'statically linked|static-pie'
      - name: pack
        run: |
          name="seqpeeq-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/seqpeeq" README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: upload
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
