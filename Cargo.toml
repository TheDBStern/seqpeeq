[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
seqpeeq-core = { path = "crates/seqpeeq-core" }
clap = { version = "4.6", features = ["derive"] }
shlex = "2"
jiff = "0.2"
thiserror = "2"
anyhow = "1"
ratatui = "0.30"
unicode-width = "0.2"
memmap2 = "0.9"
memchr = "2"
regex = "1"
flate2 = "1"
proptest = "1"
insta = "1"
tempfile = "3"
