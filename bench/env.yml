# FigTree and Jalview, and the tools that make the test data.
# conda env create -f bench/env.yml
name: seqpeeq-bench
channels:
  - conda-forge
  - bioconda
dependencies:
  - figtree=1.4.4
  - jalview=2.11.5.1   # needs Java below 12, hence a separate IGV environment
  - samtools=1.25
  - hyperfine
  - numpy
  - python=3.12
  - actionlint
